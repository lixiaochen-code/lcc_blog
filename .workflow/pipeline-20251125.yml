version: '1.0'
name: pipeline-20251125
displayName: 发布
triggers:
  trigger: manual
  push:
    branches:
      prefix:
        - realse
stages:
  - name: stage-a2125f4e
    displayName: 未命名
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: Nodejs 构建
        nodeVersion: 24.5.0
        commands:
          - '# 设置NPM源，提升安装速度'
          - npm config set registry https://registry.npmmirror.com
          - '# 安装pnpm'
          - npm i -g pnpm
          - '# 执行编译命令'
          - pnpm install && pnpm run build:mp-weixin
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./dist
        caches:
          - ~/.npm
          - ~/.yarn
        notify: []
        strategy:
          retry: '0'
strategy:
  blocking: true
